name: NYC watchlist alerts

on:
  schedule:
    - cron: "17 23 * * *" # daily, ~6–7pm New York time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print matches instead of emailing"
        type: boolean
        default: false

permissions:
  contents: write # to commit state/seen.json so you aren't emailed twice

concurrency: watchlist-alerts

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchlist-alerts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: watchlist-alerts/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check watchlist against NYC theaters
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m watchlist_alerts ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save which screenings were already emailed
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "watchlist-alerts: update sent screenings"
          git push
